<html lang=pl>
<meta charset="utf-8">
<title>Chiński pokój?</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:        #f3efe3;
    --paper-raised: #fbf8ef;
    --ink:          #241f17;
    --ink-soft:     #6d6252;
    --line:         #ddd2ba;
    --line-strong:  #c7b99a;
    --copper:       #b85a26;
    --copper-soft:  rgba(184,90,38,.13);
    --cool:         #2f6ea6;
    --good:         #2f7a52;
    --focus:        #8a4a1f;
    --track:        #e6dcc4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:        #171310;
      --paper-raised: #211b14;
      --ink:          #f1e7d6;
      --ink-soft:     #a5947c;
      --line:         #3d3324;
      --line-strong:  #55462f;
      --copper:       #e08a4c;
      --copper-soft:  rgba(224,138,76,.16);
      --cool:         #6fa8d8;
      --good:         #5fbf8c;
      --focus:        #f0a869;
      --track:        #362c1e;
    }
  }
  :root[data-theme="dark"]{
    --paper:        #171310;
    --paper-raised: #211b14;
    --ink:          #f1e7d6;
    --ink-soft:     #a5947c;
    --line:         #3d3324;
    --line-strong:  #55462f;
    --copper:       #e08a4c;
    --copper-soft:  rgba(224,138,76,.16);
    --cool:         #6fa8d8;
    --good:         #5fbf8c;
    --focus:        #f0a869;
    --track:        #362c1e;
  }

  *{ box-sizing: border-box; }
  body{
    background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  h1,h2,h3{ font-family:"IBM Plex Serif", Georgia, serif; text-wrap: balance; margin: 0; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, "SF Mono", monospace; font-variant-numeric: tabular-nums; }

  .page{
    max-width: 780px; margin: 0; padding: 8px 8px 10px;
    display: grid; grid-template-columns: 90px 1fr; gap: 5px;
  }
  header.top{
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap;
    padding-bottom: 18px; border-bottom: 1px solid var(--line-strong); margin-bottom: 4px;
  }
  header.top .eyebrow{
    text-transform: uppercase; letter-spacing: .09em; font-size: 11px;
    color: var(--copper); font-weight: 600; margin-bottom: 6px;
  }
  header.top h1{ font-size: 26px; font-weight: 600; }
  header.top p{ max-width: 56ch; color: var(--ink-soft); font-size: 13px; margin-top: 6px; }
  header.top .spec{ text-align: right; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  header.top .spec b{ color: var(--ink); font-weight: 600; }

  section.panel{
    background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 18px 20px;
  }
  .rail{ display:flex; flex-direction: column; gap: 16px; min-width: 0; }
  .panel h2{
    font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px;
  }
  .panel h2 span.tag{
    font-family:"IBM Plex Mono", monospace; text-transform: none; letter-spacing: 0;
    font-size: 11px; color: var(--ink-soft); font-weight: 500;
  }
  .panel .hint{ color: var(--ink-soft); font-size: 12px; margin: 2px 0 14px; }

  /* ---- predictive keyboard ---- */
  .keyboard{ grid-column: 1 / -1; }
  .type-field{
    display:flex; align-items:center; gap:2px; width:100%;
    background: var(--paper); border:1px solid var(--line-strong); border-radius:8px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .type-field input{
    flex:0 1 auto; min-width:20em; border:none; background:transparent; outline:none;
    font-family:"IBM Plex Mono", monospace; font-size:17px; color:var(--ink);
  }
  .type-field input::placeholder{ color:var(--ink-soft); opacity:.6; }
  .type-field:focus-within{ border-color: var(--copper); box-shadow: 0 0 0 3px var(--copper-soft); }
  .ghost{
    flex:1 1 auto; font-family:"IBM Plex Mono", monospace; font-size:17px;
    color:var(--ink-soft); opacity:.45; white-space:pre; pointer-events:none;
    overflow:hidden; text-overflow:ellipsis;
  }

  .suggest-row{ display:flex; gap:8px; align-items:stretch; }
  .suggest-key{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    padding: 2px; border:1px solid var(--line-strong); border-radius:8px;
    background:transparent; color:var(--ink); font:inherit; cursor:pointer; min-width:0;
  }
  .suggest-key:hover{ border-color:var(--copper); background:var(--copper-soft); }
  .suggest-key:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .suggest-key.top{ border-color:var(--copper); background:var(--copper-soft); }
  .suggest-key.split{ border-color:var(--good); }
  .suggest-key .k{ font-family:"IBM Plex Mono",monospace; font-size:18px; font-weight:600; line-height:1.1; }
  .suggest-key .pct{ font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-soft); }

  .kb-actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  button.act{
    padding:8px 13px; border-radius:7px; border:1px solid var(--line-strong);
    background:transparent; color:var(--ink); font:inherit; font-weight:500; font-size:12px; cursor:pointer;
  }
  button.act:hover{ border-color:var(--copper); color:var(--copper); }
  button.act:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  button.act:disabled{ opacity:.4; cursor:not-allowed; }
  button.act.is-active{ background:var(--copper); color:var(--paper-raised); border-color:var(--copper); }
  .sample-toggle{
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); cursor:pointer; user-select:none;
  }
  .sample-toggle input{ accent-color: var(--copper); width:14px; height:14px; cursor:pointer; }
  .kb-status{
    margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-soft);
  }

  /* ---- rail bits ---- */
  .sentence-list{ display:flex; flex-direction:column; gap:3px; }
  .sentence{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; line-height:1.45;
    background:var(--track); border-radius:4px; padding:4px 8px; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .fork-list{ display:flex; flex-direction:column; gap:5px; }
  .fork-btn{
    display:flex; align-items:center; justify-content:space-between; gap:8px; text-align:left;
    padding:6px 9px; border:1px solid var(--line-strong); border-radius:6px;
    background:transparent; color:var(--ink); font:inherit; cursor:pointer; width:100%;
  }
  .fork-btn:hover{ border-color:var(--copper); background:var(--copper-soft); }
  .fork-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .fork-btn .pre{
    font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .fork-btn .split{
    font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--copper);
    white-space:nowrap; font-weight:600;
  }

  .chips{ display:flex; flex-wrap:wrap; gap:4px; }
  .chip{
    font-family:"IBM Plex Mono",monospace; font-size:11.5px; width:22px; height:22px;
    display:grid; place-items:center; border-radius:4px; background:var(--track); color:var(--ink-soft);
  }
  .chip.is-active{ background:var(--copper); color:var(--paper-raised); font-weight:600; }
  .stat{
    margin-top:12px; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-soft);
    padding-top:10px; border-top:1px solid var(--line); line-height:1.6;
  }
  .stat b{ color:var(--ink); }

  /* ---- lookup figure ---- */
  .lookup{ display:flex; gap: 2px; align-items:flex-start; overflow-x:auto; padding-bottom:4px; }
  .grid-block{ display:grid; gap:2px; min-width:0; }
  .grid-row{ display:grid; gap:2px; align-items:center; }
  .rlabel{
    font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-soft);
    text-align:right; padding-right:6px; white-space:nowrap;
  }
  .hcell{
    font-family:"IBM Plex Mono",monospace; font-size:11px; text-align:center;
    color:var(--ink-soft); height:16px; line-height:16px;
  }
  .hcell.lit{ color:var(--copper); font-weight:600; }
  .ocell{
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; text-align:center;
    height:19px; line-height:19px; border-radius:3px; background:var(--track); color:var(--ink-soft);
  }
  .ocell.lit{ background:var(--copper); color:var(--paper-raised); font-weight:700; }
  .wcell{ height:16px; border-radius:2px; opacity:.3; }
  .wcell.lit{ opacity:1; box-shadow: inset 0 0 0 3px var(--copper); }
  .sep{ height:1px; background:var(--line-strong); margin:4px 0 3px; opacity:.7; }

  .embed-strip{ display:grid; gap:2px; }
  .embed-cap{
    font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--copper);
    height:16px; line-height:16px; white-space:nowrap;
  }
  .embed-strip .embed-cap { text-align: center }
  .hidden-strip .embed-cap { text-align: left }
  .prob-strip .embed-cap { text-align: right }
  .ecell{
    font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:10px;
    height:16px; line-height:16px; text-align:center; width:52px;
    border-radius:3px; background:var(--copper-soft); border:1px solid var(--copper); color:var(--ink);
  }
  .ecell.empty{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
  .ecell.state{ background:var(--track); border-color:var(--line-strong); }
  .prob-strip{ display:grid; gap:2px; }
  .prow{ display:grid; grid-template-columns:15px 44px; gap:3px; align-items:center; height:16px; }
  .pch{
    font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--ink-soft);
    text-align:center; line-height:16px;
  }
  .pval{
    font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:10px;
    line-height:16px; text-align:center; border-radius:3px;
    border:1px solid var(--line); color:var(--ink);
  }
  .prow.best .pch{ color:var(--good); font-weight:700; }
  .prow.best .pval{ border-color:var(--good); border-width:1.5px; font-weight:600; }
  .op-col{ align-self:stretch; display:flex; flex-direction:column; }
  .op-body{ flex:1; display:grid; place-items:center; color:var(--ink-soft); font-size:15px; padding:0 2px; }
  .lookup-formula{
    font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-soft);
    margin-top:10px; padding-top:10px; border-top:1px solid var(--line); line-height:1.6;
  }
  .lookup-formula b{ color:var(--copper); font-weight:600; }
  .eos-note{
    display:flex; align-items:center; gap:9px;
    background:var(--track); border:1px dashed var(--line-strong); border-radius:8px;
    padding:11px 13px; font-size:12.5px; color:var(--ink-soft); line-height:1.5;
  }
  .eos-note .stop{
    font-family:"IBM Plex Mono",monospace; font-size:15px; font-weight:700;
    color:var(--copper); flex:none;
  }
  .eos-note b{ color:var(--ink); font-weight:600; }

  .stage{ margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
  .stage h3{
    font-family:"IBM Plex Mono",monospace; font-size:11px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--ink-soft); font-weight:600; margin-bottom:3px;
  }
  .stage .formula{ font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft); margin-bottom:12px; }
  .stage .formula b{ color:var(--copper); font-weight:600; }

  .hvec{ display:flex; flex-wrap:wrap; gap:3px; }
  .hunit{
    font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:10.5px;
    width:46px; height:24px; line-height:24px; text-align:center; border-radius:4px;
  }

  .bars{ display:flex; flex-direction:column; gap:6px; }
  .bar-row{ display:grid; grid-template-columns: 24px 1fr 56px; gap:10px; align-items:center; }
  .bar-key{ font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--ink); text-align:center; }
  .bar-val{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:11.5px; text-align:right; color:var(--ink-soft); }
  .bar-track{ position:relative; height:15px; background:var(--track); border-radius:4px; overflow:hidden; }
  .bar-fill{ position:absolute; top:0; bottom:0; left:0; border-radius:3px; background:var(--copper); }
  .bar-row.is-top .bar-fill{ background:var(--good); }
  .bar-row.is-top .bar-key, .bar-row.is-top .bar-val{ color:var(--good); font-weight:600; }

  @media (max-width: 900px){
    .page{ grid-template-columns: 1fr; }
  }
</style>

<div class="page">
  <section class="panel keyboard">
    <span class="tag" id="kb-tag"></span>
    <div class="type-field">
      <input id="typed" type="text" spellcheck="false" autocomplete="off" autocapitalize="off"
             aria-label="typed text" placeholder="▶">
      <span class="ghost" id="ghost"></span>
    </div>
    <div class="suggest-row" id="suggest-row"></div>
    <div class="kb-actions">
      <button class="act" id="btn-back">⌫</button>
      <button class="act" id="btn-auto">Uzupełnij automatycznie</button>
      <button class="act" id="btn-clear">Wyczyść</button>
      <label class="sample-toggle"><input type="checkbox" id="chk-sample">losuj spośród prawdopodobnych znaków</label>
      <span class="kb-status" id="kb-status"></span>
    </div>
  </section>

  <div class="rail">
    <section class="panel">
      <span class="tag" id="vocab-tag"></span>
      <div class="chips" id="vocab-chips"></div>
      <div class="stat" id="zero-stat"></div>
    </section>
  </div>

  <section class="panel">
    <h2><span class="tag" id="lookup-tag"></span></h2>
    <div class="lookup">
      <div class="grid-block" id="matrix-block"></div>
      <div class="embed-strip" id="embed-strip"></div>
      <div class="op-col"><div class="embed-cap">&nbsp;</div><div class="op-body">→</div></div>
      <div class="embed-strip" id="hidden-strip"></div>
      <div class="op-col"><div class="embed-cap">&nbsp;</div><div class="op-body">→</div></div>
      <div class="prob-strip" id="prob-strip"></div>
    </div>
    <div class="lookup-formula">
      <span id="hcount"></span>
      <span id="hcount2"></span>
      <span id="vcount2"></span>
    </div>

      <span id="vcount"></span>
      <div class="bars" id="prob-bars"></div>
  </section>
</div>

    });
    forks.sort(function(a,b){ return (b.spread - a.spread) || (b.prefix.length - a.prefix.length); });
    var used = [];
    forks.forEach(function(f){
      if (out.length >= 4) return;
      if (used.some(function(u){ return u.indexOf(f.prefix) === 0 || f.prefix.indexOf(u) === 0; })) return;
      used.push(f.prefix);
      out.push({ text: f.prefix, note: f.ways + ' ways · ' + f.seen + ' sentences', mode: 'sentence' });
    });

    // word-stems: a common word cut short, so it is never a sentence prefix
    var freq = {};
    SENTENCES.join(' ').split(/[ .,]+/).forEach(function(w){ if (w.length >= 6) freq[w] = (freq[w]||0)+1; });
    Object.keys(freq)
      .sort(function(a,b){ return freq[b] - freq[a]; })
      .forEach(function(w){
        if (out.length >= 8) return;
        var stem = w.slice(0, 4);
        if (SENTENCES.some(function(s){ return s.indexOf(stem) === 0; })) return;  // must miss sentence mode
        if (out.some(function(o){ return o.text === stem; })) return;
        out.push({ text: stem, note: 'mid-word · ' + w, mode: 'continuation' });
      });
    return out;
  })();
  // ---------------------------------------------------------------- static rail
  (function buildRail(){
    var chipHost = document.getElementById('vocab-chips');
    VOCAB.forEach(function(c){
      var el = document.createElement('span');
      el.className = 'chip'; el.textContent = show(c);
      chipHost.appendChild(el);
    });
    document.getElementById('vocab-tag').textContent = V + ' symboli';
  })();
  var chipEls = Array.prototype.slice.call(document.querySelectorAll('#vocab-chips .chip'));

  // ---------------------------------------------------------------- lookup figure
  function gridTemplate(){ return '58px repeat(' + V + ', 22px)'; }

  function renderMatrix(hot){
    var block = document.getElementById('matrix-block');
    block.innerHTML = '';
    function addRow(label, build){
      var row = document.createElement('div');
      row.className = 'grid-row';
      row.style.gridTemplateColumns = gridTemplate();
      var lab = document.createElement('div');
      lab.className = 'rlabel'; lab.innerHTML = label;
      row.appendChild(lab);
      for (var j = 0; j < V; j++) row.appendChild(build(j));
      block.appendChild(row);
    }
    addRow('', function(j){
      var c = document.createElement('div');
      c.className = 'hcell' + (j === hot ? ' lit' : '');
      c.textContent = show(VOCAB[j]);
      return c;
    });
    addRow('x<sub>t</sub> =', function(j){
      var c = document.createElement('div');
      c.className = 'ocell' + (j === hot ? ' lit' : '');
      c.textContent = hot < 0 ? '·' : (j === hot ? '1' : '0');
      return c;
    });
    var sep = document.createElement('div');
    sep.className = 'sep'; block.appendChild(sep);
    for (var i = 0; i < H; i++){
      (function(i){
        addRow(i === 0 ? 'W<sub>xh</sub> =' : '', function(j){
          var c = document.createElement('div');
          c.className = 'wcell' + (j === hot ? ' lit' : '');
          c.style.background = weightColor(W.Wxh[i][j], WXH_MAX);
          c.title = (VOCAB[j] === ' ' ? 'space' : VOCAB[j]) + ', row ' + i + ' = ' + W.Wxh[i][j].toFixed(2);
          return c;
        });
      })(i);
    }
  }

  function renderEmbedding(hot){
    var strip = document.getElementById('embed-strip');
    strip.innerHTML = '';
    var cap = document.createElement('div');
    cap.className = 'embed-cap';
    cap.textContent = hot < 0 ? 'brak znaku' : '“' + show(VOCAB[hot]) + '”';
    strip.appendChild(cap);
    var spacer = document.createElement('div');
    spacer.style.height = '19px'; spacer.style.marginBottom = '5px';
    strip.appendChild(spacer);
    for (var i = 0; i < H; i++){
      var cell = document.createElement('div');
      cell.className = 'ecell' + (hot < 0 ? ' empty' : '');
      cell.textContent = hot < 0 ? '·' : fmt(W.Wxh[i][hot]);
      strip.appendChild(cell);
    }
  }

  function renderHiddenColumn(hv, blank){
    var strip = document.getElementById('hidden-strip');
    var cap = document.createElement('div');
    cap.className = 'embed-cap';
    cap.style.color = 'var(--ink-soft)';
    cap.innerHTML = 'ukryty<br/>stan';
    strip.innerHTML = '';
    strip.appendChild(cap);
    var spacer = document.createElement('div');
    spacer.style.height = '19px'; spacer.style.marginBottom = '5px';
    strip.appendChild(spacer);
    hv.forEach(function(v){
      var cell = document.createElement('div');
      cell.className = 'ecell state';
      if (!blank){
        cell.style.background = lerpHex(css('--track'), v >= 0 ? css('--copper') : css('--cool'), Math.abs(v));
        cell.style.color = Math.abs(v) > 0.55 ? css('--paper-raised') : css('--ink');
      }
      cell.textContent = fmt(v);
      strip.appendChild(cell);
    });
  }

  function ranked(p, n){
    return p.map(function(v,k){ return { k:k, v:v }; })
            .sort(function(a,b){ return b.v - a.v; }).slice(0, n);
  }

  function renderProbColumn(p, halted){
    var strip = document.getElementById('prob-strip');
    var cap = document.createElement('div');
    cap.className = 'embed-cap';
    cap.style.color = halted ? 'var(--ink-soft)' : 'var(--good)';
    cap.textContent = halted ? 'P(symbol)' : 'P(symbol)';
    strip.innerHTML = '';
    strip.appendChild(cap);
    var spacer = document.createElement('div');
    spacer.style.height = '19px'; spacer.style.marginBottom = '5px';
    strip.appendChild(spacer);
    var best = halted ? -1 : p.indexOf(Math.max.apply(null, p));
    for (var k = 0; k < V; k++){
      var row = document.createElement('div');
      row.className = 'prow' + (k === best ? ' best' : '');
      var ch = document.createElement('span');
      ch.className = 'pch'; ch.textContent = show(VOCAB[k]);
      var v = document.createElement('span');
      v.className = 'pval';
      if (halted){ v.textContent = '·'; v.style.color = 'var(--ink-soft)'; }
      else {
        v.textContent = p[k].toFixed(2);
        v.style.background = lerpHex(css('--track'), css('--good'), Math.min(1, p[k]));
        v.style.color = p[k] > 0.55 ? css('--paper-raised') : css('--ink');
      }
      row.appendChild(ch); 
      row.appendChild(v);
      strip.appendChild(row);
    }
  }

  function renderProbs(p){
    var host = document.getElementById('prob-bars');
    host.innerHTML = '';
    ranked(p, 6).forEach(function(d, rank){
      var row = document.createElement('div');
      row.className = 'bar-row' + (rank === 0 ? ' is-top' : '');
      row.innerHTML =
        '<span class="bar-key">' + show(VOCAB[d.k]) + '</span>' +
        '<span class="bar-track"><span class="bar-fill" style="width:' + (d.v*100).toFixed(2) + '%"></span></span>' +
        '<span class="bar-val">' + (d.v*100).toFixed(1) + '%</span>';
      host.appendChild(row);
    });
  }

  function renderSuggestions(p){
    var host = document.getElementById('suggest-row');
    host.innerHTML = '';
    var top3 = ranked(p, 3);
    // A real split (nothing near-certain) is worth flagging — that is the fork.
    var isSplit = top3[0].v < 0.9;
    top3.forEach(function(d, rank){
      var b = document.createElement('button');
      b.className = 'suggest-key' + (rank === 0 ? ' top' : '') + (isSplit && d.v > 0.05 ? ' split' : '');
      b.innerHTML = '<span class="k">' + show(VOCAB[d.k]) + '</span>' +
                    '<span class="pct">' + (d.v*100).toFixed(1) + '%</span>';
      b.setAttribute('aria-label', 'zaakceptuj ' + (VOCAB[d.k] === ' ' ? '_' : VOCAB[d.k]) +
                     ', ' + (d.v*100).toFixed(1) + ' percent');
      b.addEventListener('click', function(){ stopAuto(); accept(VOCAB[d.k]); });
      host.appendChild(b);
    });
  }

  // ---------------------------------------------------------------- typing
  function sanitize(s){
    return s.toLowerCase().split('').filter(function(c){ return ixOf(c) >= 0; }).join('');
  }
  function isEndOfSentence(text){ return text.slice(-1) === '.'; }

  function showEndOfSentence(){
    document.getElementById('suggest-row').innerHTML = '';
    document.getElementById('prob-bars').hidden = true;
  }
  function accept(ch){
    typedEl.value = typedEl.value + ch;
    render();
    typedEl.focus();
  }

  function render(){
    var text = sanitize(typedEl.value);
    if (text !== typedEl.value) typedEl.value = text;

    var run = runPrefix(text);
    var p = probsFrom(run.h);
    var hot = run.last;

    var eos = isEndOfSentence(text);

    // The lookup itself stays live even at a full stop: "." has a one-hot and a
    // column like any other key, and the state it produces is a real value.
    renderMatrix(hot);
    renderEmbedding(hot);
    renderHiddenColumn(run.h, hot < 0 ? true : ((eos || run.atBoundary) ? 'reset' : false));
    renderProbColumn(p, eos);
    if (eos){
      showEndOfSentence();
    } else {
      document.getElementById('prob-bars').hidden = false;
      renderProbs(p);
      renderSuggestions(p);
    }

    chipEls.forEach(function(el, i){ el.classList.toggle('is-active', i === hot); });
    document.getElementById('lookup-tag').textContent =
      hot < 0 ? 'pusty stan — nic nie wpisano' : 'x = ' + show(VOCAB[hot]);
    // Ghost: where the top guess would lead, stopping at a full stop.
    var ghost = '';
    if (!eos){
      var gh = run.h.slice();
      for (var s = 0; s < 32; s++){
        var gp = probsFrom(gh), best = gp.indexOf(Math.max.apply(null, gp));
        ghost += VOCAB[best];
        if (VOCAB[best] === '.') break;
        gh = stepHidden(gh, best);
      }
    }
    document.getElementById('ghost').textContent = ghost;
    document.getElementById('btn-back').disabled = text.length === 0;
    document.getElementById('btn-auto').disabled = eos;
  }

  // ---------------------------------------------------------------- autocomplete
  function stopAuto(){
    if (autoTimer){ clearInterval(autoTimer); autoTimer = null; }
    var btn = document.getElementById('btn-auto');
    btn.classList.remove('is-active');
    btn.textContent = 'Uzupełnij automatyczniej';
  }
  function startAuto(){
    if (isEndOfSentence(sanitize(typedEl.value))) return;
    var btn = document.getElementById('btn-auto');
    btn.classList.add('is-active');
    btn.textContent = 'Przerwij';
    var sample = document.getElementById('chk-sample').checked;
    var added = 0, LIMIT = 60;
    autoTimer = setInterval(function(){
      var run = runPrefix(sanitize(typedEl.value));
      var k = pick(probsFrom(run.h), sample);
      typedEl.value = typedEl.value + VOCAB[k];
      added++;
      render();
      if (VOCAB[k] === '.' || added >= LIMIT){
        stopAuto();
      }
    }, 90);
  }

  typedEl.addEventListener('input', function(){ stopAuto(); render(); });
  document.getElementById('btn-back').addEventListener('click', function(){
    stopAuto(); typedEl.value = typedEl.value.slice(0, -1); render(); typedEl.focus();
  });
  document.getElementById('btn-clear').addEventListener('click', function(){
    stopAuto(); typedEl.value = ''; render(); typedEl.focus();
  });
  document.getElementById('btn-auto').addEventListener('click', function(){
    if (autoTimer) stopAuto(); else startAuto();
  });

  // Open mid-sentence, one keystroke before a real fork.
  typedEl.value = '';
  render();
})();
</script>
